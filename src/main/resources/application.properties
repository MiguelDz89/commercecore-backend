
# ==========================================
# CommerceCore Backend
# ==========================================
quarkus.application.name=commercecore-backend
quarkus.http.port=8080

# ==========================================
# PostgreSQL / Hibernate
# ==========================================
quarkus.datasource.db-kind=postgresql
quarkus.datasource.jdbc.max-size=5
quarkus.datasource.jdbc.min-size=0

# Flyway owns schema migrations
quarkus.hibernate-orm.schema-management.strategy=none
%dev.quarkus.hibernate-orm.validate-in-dev-mode=true
quarkus.flyway.locations=db/migration
quarkus.flyway.clean-at-start=false
quarkus.flyway.clean-disabled=true



# ==========================================
# Development and Test
# ==========================================
%test.quarkus.flyway.migrate-at-start=true

# ==========================================
# Production
# ==========================================
%prod.quarkus.datasource.jdbc.url=${DB_JDBC_URL}
%prod.quarkus.datasource.username=${DB_USERNAME}
%prod.quarkus.datasource.password=${DB_PASSWORD}
%prod.quarkus.flyway.migrate-at-start=false
%prod.quarkus.flyway.validate-at-start=true

# ==========================================
# OpenAPI
# ==========================================
quarkus.smallrye-openapi.info-title=CommerceCore API
quarkus.smallrye-openapi.info-version=1.0.0
